<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produktrekkefølge · Konseptuell</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/admin/admin.css"><style>main{max-width:1000px;margin:30px auto;padding:0 20px}.order-controls{display:flex;gap:20px;flex-wrap:wrap}.order-controls label{display:grid;gap:8px}select{padding:12px;max-width:100%;background:var(--paper);color:var(--ink);border:1px solid var(--line)}#orderList{list-style:none;padding:0}.order-row{display:grid;grid-template-columns:30px 72px minmax(0,1fr) auto;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}.order-row img,.order-image{width:72px;height:64px;object-fit:contain;background:white}.order-row small{display:block;margin-top:5px}.order-arrows{display:flex;gap:8px}.order-arrows button{width:44px;height:44px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:24px}.order-arrows button:disabled{opacity:.3}.order-save{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:16px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}#orderStatus{min-height:28px}@media(max-width:500px){.order-row{grid-template-columns:20px 52px minmax(0,1fr) 44px;gap:8px}.order-row img,.order-image{width:52px;height:54px}.order-arrows{flex-direction:column}main{padding:0 14px}}</style></head><body class="admin-body"><main><a href="/admin">← Til admin</a><h1>Produktrekkefølge</h1><p>Bestem hvilke produkter kunden ser først. Dette endrer bare rekkefølgen, ikke priser, lager eller hvilke produkter som vises.</p><div class="order-controls"><label>Bruksområde<select id="orderPurpose"></select></label><label>Kategori<select id="orderCategory"><option>Alle</option></select></label></div><p id="orderMode"></p><p><span id="orderCount"></span> · <a id="orderPreview" target="_blank" rel="noopener">Se lagret utvalg på nettsiden ↗</a></p><button type="button" id="orderReset" class="button button-outline">Bruk standardrekkefølge for dette utvalget</button><p id="orderStatus" role="status">Laster …</p><ol id="orderList"></ol><div class="order-save"><button id="orderSave" class="button dark" disabled>Lagre rekkefølge</button><button id="orderReload" class="button button-outline">Forkast endringer</button><span id="orderDirty"></span></div></main><script type="module" src="/admin/catalog-order.js"></script></body></html>
